name: API
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: olvanta-api
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: olvanta-api/global.json
      - name: Restore, build and test
        working-directory: olvanta-api
        run: |
          dotnet restore --locked-mode
          dotnet format --verify-no-changes --no-restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/olvanta-web
          ref: ${{ vars.OLVANTA_WEB_REF || 'develop' }}
          token: ${{ secrets.OLVANTA_READ_TOKEN || github.token }}
          path: olvanta-web
      - name: Start clean stack and verify SQL readiness
        shell: pwsh
        run: ./olvanta-api/scripts/Start-Local.ps1
      - name: Verify served contract
        run: |
          curl -fsS http://127.0.0.1:5180/openapi/v1.json | jq -S . > "$RUNNER_TEMP/served.json"
          jq -S . olvanta-api/contracts/olvanta-v1.json | diff -u - "$RUNNER_TEMP/served.json"
          cmp olvanta-api/contracts/olvanta-v1.json olvanta-web/contracts/olvanta-v1.json
      - name: Verify database outage and recovery
        working-directory: olvanta-api/deploy
        run: |
          docker compose stop sql
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5180/health/live)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5180/health/ready)" = 503
          test "$(curl -s -o "$RUNNER_TEMP/status.json" -w '%{http_code}' http://127.0.0.1:5180/api/v1/system/status)" = 503
          jq -e '.status == "degraded" and .database == "unavailable"' "$RUNNER_TEMP/status.json"
          docker compose start sql
          pwsh -File ../scripts/Test-Local.ps1
      - name: Inspect service status on failure
        if: failure()
        working-directory: olvanta-api/deploy
        run: docker compose ps -a
