name: olvanta
x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2025-CU11-ubuntu-24.04@sha256:05644dad1266ca3d445d1e8f6d2ebb9a6a03df9a39376e0f7b48917356dca9d9
services:
  sql:
    image: *sql-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${OLVANTA_SA_PASSWORD:?Ejecute Start-Local.ps1}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 3 -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  sql-init:
    image: *sql-image
    depends_on:
      sql:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${OLVANTA_SA_PASSWORD:?Ejecute Start-Local.ps1}
      APP_PASSWORD: ${OLVANTA_APP_PASSWORD:?Ejecute Start-Local.ps1}
    volumes:
      - ./init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
  migrate:
    build:
      context: ..
      target: api
    depends_on:
      sql-init:
        condition: service_completed_successfully
    command: ["--initialize"]
    environment:
      ConnectionStrings__Olvanta: "Server=sql;Database=Olvanta;User ID=sa;Password=${OLVANTA_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Bootstrap__AdminPassword: ${OLVANTA_ADMIN_PASSWORD:?Ejecute Start-Local.ps1}
  api:
    build:
      context: ..
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - identity-keys:/app/keys
    environment:
      Security__KeyPath: /app/keys
      Security__LocalHttp: "true"
      ConnectionStrings__Olvanta: "Server=sql;Database=Olvanta;User ID=olvanta_app;Password=${OLVANTA_APP_PASSWORD:?Ejecute Start-Local.ps1};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
  worker:
    build:
      context: ..
      target: worker
    depends_on:
      sql-init:
        condition: service_completed_successfully
  web:
    build:
      context: ../../olvanta-web
    depends_on: [api]
    ports:
      - "127.0.0.1:${OLVANTA_PORT:-5180}:8080"
volumes:
  sql-data:
  identity-keys:
